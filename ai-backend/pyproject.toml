[project]
name = "intelliclass-ai-backend"
version = "2.0.0"
description = "IntelliClass AI - Multi-modal RAG & Visual Asset Extraction FastAPI Backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pymupdf>=1.24.0",
    "tiktoken>=0.7.0",
    "requests>=2.32.0",
    "chardet>=5.0.0,<6.0.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.8.0",
    "supabase>=2.7.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
